name: Scrape GPU prices

on:
  schedule:
    - cron: "30 8,18 * * *"   # 2x dziennie, czas UTC (08:00 i 20:00 w Polsce latem)
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scraper.py

      - name: Generate charts
        if: always()
        continue-on-error: true
        run: |
          pip install -r requirements-analysis.txt
          python generate_charts.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.csv
          [ -d charts ] && git add charts || true
          git diff --staged --quiet || git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M')"
          git push
